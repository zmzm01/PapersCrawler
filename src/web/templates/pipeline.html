{% extends "base.html" %}
{% block title %}Pipeline Control{% endblock %}
{% block content %}
<h2 data-i18n="pipeline.title">Pipeline Control</h2>

<table class="phase-table" id="phase-table">
  <thead>
    <tr>
      <th data-i18n="pipeline.phase">Phase</th>
      <th data-i18n="pipeline.label">Label</th>
      <th data-i18n="pipeline.status">Status</th>
    </tr>
  </thead>
  <tbody>
    {% for phase in phases %}
    <tr>
      <td><strong>{{ phase.key }}</strong></td>
      <td>{{ phase.label }}</td>
      <td><span class="badge badge-pending" id="badge-{{ phase.key }}">-</span></td>
    </tr>
    {% endfor %}
  </tbody>
</table>

<h3 data-i18n="pipeline.live_log">Live Log</h3>
<div class="log-controls">
  <label><span data-i18n="pipeline.filter">Filter:</span>
    <select id="log-filter" onchange="filterPipelineLog()">
      <option value="ALL">ALL</option>
      <option value="ERROR">ERROR</option>
      <option value="WARNING">WARNING</option>
      <option value="INFO">INFO</option>
      <option value="DEBUG">DEBUG</option>
    </select>
  </label>
</div>
<pre id="log-viewer" class="log-viewer"><code data-i18n="pipeline.waiting">Waiting for log output...</code></pre>

<script>
const logViewer = document.getElementById('log-viewer');
let rawLogText = logViewer.textContent;
const evtSource = new EventSource('/pipeline/logs');
evtSource.onmessage = function(e) {
  const data = JSON.parse(e.data);
  rawLogText += data.text;
  applyPipelineLogFilter();
};

function applyPipelineLogFilter() {
  const level = document.getElementById('log-filter').value;
  const lines = rawLogText.split('\n');
  if (level === 'ALL') {
    logViewer.textContent = lines.join('\n');
  } else {
    logViewer.textContent = lines.filter(l => l.includes('[' + level + ']')).join('\n');
  }
  logViewer.scrollTop = logViewer.scrollHeight;
}

function filterPipelineLog() { applyPipelineLogFilter(); }

const PHASE_KEY_MAP = {
  'B': 'cr_metadata_fetched',
  'C': 'publisher_page',
  'E': 'llm_relevance',
  'E2': 'mineru_parse',
  'F': 'llm_summary',
};

async function refreshPipelineStatus() {
  const r = await fetch('/pipeline/status');
  const data = await r.json();
  for (const [phaseKey, statKey] of Object.entries(PHASE_KEY_MAP)) {
    const counts = data.phases[statKey];
    if (!counts) continue;
    const total = counts.success + counts.failed + counts.skipped + counts.pending;
    const badge = document.getElementById('badge-' + phaseKey);
    if (badge) {
      badge.textContent = total + ' papers';
      badge.className = 'badge badge-pending';
    }
  }
}
refreshPipelineStatus();
setInterval(refreshPipelineStatus, 10000);
</script>
{% endblock %}
