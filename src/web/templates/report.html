{% extends "base.html" %}
{% block title %}Report{% endblock %}
{% block content %}
<h2 data-i18n="report.title">Report</h2>

{% if reports %}
<div class="report-viewer">
  <div class="report-viewer-toolbar">
    <label class="report-select-label">
      <span data-i18n="report.choose_report">Report:</span>
      <select id="report-select" onchange="window.location.href='/report?show=' + encodeURIComponent(this.value)">
        <option value="" data-i18n="report.select_hint">-- Select a report --</option>
        {% for r in reports %}
        <option value="{{ r.filename }}" {% if r.filename == selected_filename %}selected{% endif %}>{{ r.filename[7:15] }} · {{ r.source }} · {{ r.paper_count }} papers · {{ r.timeago }}</option>
        {% endfor %}
      </select>
    </label>
    <a id="report-download-link" class="btn btn-sm btn-primary" target="_blank" data-i18n="report.download">Download</a>
  </div>
  <div id="report-content" class="report-content">
    {% if selected_filename %}
    <p class="text-muted">Loading...</p>
    {% else %}
    <p class="text-muted" data-i18n="report.no_report">No reports found.</p>
    {% endif %}
  </div>
</div>
{% else %}
<p class="text-muted" data-i18n="report.no_report">No reports found.</p>
{% endif %}

<script>
function renderReportContent(markdown) {
  const container = document.getElementById('report-content');
  if (!markdown) {
    container.innerHTML = '<p class="text-muted">(empty report)</p>';
    return;
  }
  const placeholders = {};
  let pid = 0;
  const protected_md = markdown.replace(
    /\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]/g,
    function(m) { var k = '@@KX' + (pid++) + '@@'; placeholders[k] = m; return k; }
  );
  var html = marked.parse(protected_md, { breaks: true, gfm: true });
  for (var k in placeholders) {
    html = html.split(k).join(placeholders[k]);
  }
  container.innerHTML = html;
  try {
    renderMathInElement(container, {
      delimiters: [
        {left: '\\[', right: '\\]', display: true},
        {left: '\\(', right: '\\)', display: false},
      ],
      throwOnError: false,
      errorColor: '#cc0000',
    });
  } catch (e) {
    console.warn('KaTeX render error:', e);
  }
}

async function loadReport(filename) {
  const container = document.getElementById('report-content');
  const dl = document.getElementById('report-download-link');
  if (!filename) {
    container.innerHTML = '<p class="text-muted" data-i18n="report.no_report">No reports found.</p>';
    dl.style.display = 'none';
    if (typeof switchLanguage === 'function') switchLanguage(currentLang);
    return;
  }
  container.innerHTML = '<p class="text-muted">Loading...</p>';
  dl.href = '/report/download/' + encodeURIComponent(filename);
  dl.style.display = 'inline-block';
  dl.setAttribute('download', filename);
  try {
    const r = await fetch('/report/data/' + encodeURIComponent(filename));
    const data = await r.json();
    if (data.ok) {
      renderReportContent(data.content);
    } else {
      container.innerHTML = '<p class="text-muted">Error: ' + (data.error || 'failed to load') + '</p>';
    }
  } catch (err) {
    container.innerHTML = '<p class="text-muted">Network error: ' + err.message + '</p>';
  }
  if (typeof switchLanguage === 'function') switchLanguage(currentLang);
}

{% if selected_filename %}
document.addEventListener('DOMContentLoaded', function() {
  loadReport({{ selected_filename | tojson }});
});
{% endif %}
</script>
{% endblock %}
